<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#140E08">

  <title>StreetJams | Find Free Curb Finds Near You & Give Items a Second Life</title>
  <meta name="description" content="StreetJams is a free app for stooping: spot useful items left on the street, snap a photo, and share them with your neighbours. Reduce urban waste. On iOS and Android.">
  <meta name="keywords" content="stooping, curb finds, free stuff near me, street finds, reduce urban waste, sustainability, StreetJams">
  <link rel="canonical" href="https://streetjams.app/">

  <!-- Open Graph / Twitter: replace domain and image with your real ones (1200x630) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StreetJams">
  <meta property="og:title" content="StreetJams | Find Free Curb Finds & Reduce Urban Waste">
  <meta property="og:description" content="Spot. Snap. Stoop. Share useful street items with your community and give them a second life.">
  <meta property="og:url" content="https://streetjams.app/">
  <meta property="og:image" content="https://streetjams.app/assets/og-image.jpg">
  <meta property="og:image:alt" content="StreetJams app on a phone next to a room full of street finds">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="StreetJams | Find Free Curb Finds & Reduce Urban Waste">
  <meta name="twitter:description" content="Spot. Snap. Stoop. Give great items a second life.">
  <meta name="twitter:image" content="https://streetjams.app/assets/og-image.jpg">

  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preload" as="image" href="/assets/room.jpg" media="(max-width: 767px)">
  <link rel="preload" as="image" href="/assets/background-image.jpg" media="(min-width: 768px)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Structured data: app + organisation + social profiles -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "StreetJams",
        "url": "https://streetjams.app/",
        "logo": "https://streetjams.app/assets/Logo-white.png",
        "sameAs": [
          "https://www.instagram.com/streetjamsapp",
          "https://www.tiktok.com/@streetjamsapp",
        ]
      },
      {
        "@type": "MobileApplication",
        "name": "StreetJams",
        "operatingSystem": "iOS, Android",
        "applicationCategory": "LifestyleApplication",
        "description": "Find and share useful items left on the street. Reduce urban waste and give items a second life.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
        "downloadUrl": "https://apps.apple.com/gb/app/streetjams/id6777686015"
      }
    ]
  }
  </script>

  <style>
    :root {
      --ink: #140E08;
      --brick: #D9612C;
      --brass: #E8B84B;
      --cream: #F2ECE0;
      --cream-dim: rgba(242,236,224,0.78);
      --line: rgba(242,236,224,0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--cream);
      background: var(--ink);
      line-height: 1.6;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }

    /* ===== HERO ===== */
    .hero { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(180deg, rgba(20,14,8,0.7) 0%, rgba(20,14,8,0.2) 20%, rgba(20,14,8,0.3) 50%, rgba(20,14,8,0.7) 80%, var(--ink) 100%),
        url('/assets/room.jpg');
      background-size: cover; background-position: center 30%;
    }
    @media (min-width: 768px) {
      .bg { background-image:
        linear-gradient(180deg, rgba(20,14,8,0.7) 0%, rgba(20,14,8,0.2) 20%, rgba(20,14,8,0.3) 50%, rgba(20,14,8,0.7) 80%, var(--ink) 100%),
        url('/assets/background-image.jpg'); background-position: center 35%; }
    }
    .content {
      position: relative; z-index: 2; flex: 1;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: calc(28px + env(safe-area-inset-top, 0px)) 24px 40px;
    }
    header { display: flex; align-items: center; justify-content: space-between; max-width: 1080px; width: 100%; margin: 0 auto; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Archivo Black', sans-serif; font-size: 22px; text-transform: uppercase; color: #fff; }
    .logo img { width: 34px; height: 34px; object-fit: contain; }

    /* ===== SOCIAL ICONS ===== */
    .social { display: flex; gap: 8px; list-style: none; }
    .social a {
      display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--line); color: var(--cream);
      background: rgba(20,14,8,0.35); backdrop-filter: blur(6px);
      transition: background .15s, color .15s, border-color .15s;
    }
    .social a:hover { background: var(--brass); color: var(--ink); border-color: var(--brass); }
    .social svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .social svg .f { fill: currentColor; stroke: none; }
    header .social a { width: 40px; height: 40px; }

    .middle { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px 0; }
    .slogan { font-family: 'Archivo Black', sans-serif; font-size: clamp(34px, 9vw, 76px); text-transform: uppercase; line-height: 1.02; letter-spacing: -0.01em; }
    .slogan span { color: var(--brass); display: block; }
    .subtitle { font-size: clamp(15px, 2.4vw, 18px); font-weight: 500; color: var(--cream-dim); margin: 20px auto 0; max-width: 480px; }

    .cta-group { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .store-badge { height: 52px; width: auto; display: block; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.35)); transition: transform .15s; }
    .cta-group a:hover .store-badge { transform: translateY(-2px); }

    /* ===== HOW IT WORKS ===== */
    .section { max-width: 1080px; margin: 0 auto; padding: 72px 24px; }
    .section h2 { font-family: 'Archivo Black', sans-serif; font-size: clamp(26px, 5vw, 40px); text-transform: uppercase; line-height: 1.1; margin-bottom: 12px; }
    .section > p { color: var(--cream-dim); max-width: 60ch; }
    .steps { list-style: none; display: grid; gap: 20px; margin-top: 36px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); counter-reset: s; }
    .steps li { border-top: 3px solid var(--brick); padding-top: 16px; counter-increment: s; }
    .steps h3 { font-family: 'Archivo Black', sans-serif; font-size: 22px; text-transform: uppercase; color: var(--brass); }
    .steps h3::before { content: counter(s) ". "; color: var(--cream-dim); }
    .steps p { color: var(--cream-dim); margin-top: 6px; }

    /* ===== FOOTER ===== */
    footer { border-top: 1px solid var(--line); padding: 36px 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
    .foot { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
    .foot-title { font-weight: 600; font-size: 14px; color: var(--cream); }
    .foot-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; list-style: none; }
    .foot-links a { color: var(--cream-dim); font-size: 14px; text-decoration: none; }
    .foot-links a:hover { color: var(--cream); text-decoration: underline; }
    .copyright { font-size: 12px; color: rgba(242,236,224,0.55); }

    @media (max-width: 480px) { header .social { display: none; } header { justify-content: center; } .store-badge { height: 48px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>

  <div class="hero">
    <div class="bg" role="presentation"></div>
    <div class="content">

      <header>
        <a class="logo" href="/" aria-label="StreetJams home">
          <img src="/assets/Logo-white.png" alt="" width="34" height="34">
          <span>StreetJams</span>
        </a>
        <!-- Social icons, top right (hidden on small phones; footer copy always shows) -->
        <ul class="social" aria-label="StreetJams on social media">
          <li><a href="https://www.instagram.com/streetjamsapp" target="_blank" rel="noopener me" aria-label="StreetJams on Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="f" cx="17.2" cy="6.8" r="1.1"/></svg></a></li>
          <li><a href="https://www.tiktok.com/@streetjamsapp" target="_blank" rel="noopener me" aria-label="StreetJams on TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.5 2 4.3 5 4.5"/></svg></a></li>
        </ul>
      </header>

      <main class="middle">
        <div>
          <h1 class="slogan">My room<span>is the city</span></h1>
          <p class="subtitle">Spot. Snap. Stoop. Give great items a second life while reducing urban waste.</p>
        </div>
      </main>

      <div class="cta-group">
        <a href="https://apps.apple.com/gb/app/streetjams/id6777686015" rel="noopener">
          <img class="store-badge" src="/assets/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg" alt="Download StreetJams on the App Store" width="156" height="52">
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.streetjams.app" rel="noopener">
          <img class="store-badge" src="/assets/GetItOnGooglePlay_Badge_Web_color_English.svg" alt="Get StreetJams on Google Play" width="175" height="52">
        </a>
      </div>
    </div>
  </div>

  <footer>
    <div class="foot">
      <p class="foot-title">Follow StreetJams</p>
      <!-- Social icons, footer (visible on every screen size) -->
      <ul class="social" aria-label="StreetJams on social media">
        <li><a href="https://www.instagram.com/streetjamsapp" target="_blank" rel="noopener me" aria-label="StreetJams on Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="f" cx="17.2" cy="6.8" r="1.1"/></svg></a></li>
        <li><a href="https://www.tiktok.com/@streetjamsapp" target="_blank" rel="noopener me" aria-label="StreetJams on TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.5 2 4.3 5 4.5"/></svg></a></li>        
      </ul>
      <nav aria-label="Footer">
        <ul class="foot-links">
          <li><a href="/privacy">Privacy Policy</a></li>
          <li><a href="/terms">Terms &amp; Conditions</a></li>
          <li><a href="/support">Support</a></li>
          <li><a href="/game">Game</a></li>
        </ul>
      </nav>
      <p class="copyright">© 2026 StreetJams. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
