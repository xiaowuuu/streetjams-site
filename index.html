<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>StreetJams | Discover and Share Local Finds</title>

  <meta name="description" content="Discover and share free local finds with StreetJams. Join the stooping community, reduce urban waste, and help give unwanted items a second life.">
  <meta name="keywords" content="stooping, street, curb finds, free stuff, street bounty, urban waste, sustainability, streetjams">
  <meta property="og:title" content="StreetJams | Discover Local Finds">
  <meta property="og:description" content="Discover and share free local finds with StreetJams. Join the stooping community, reduce urban waste, and help give unwanted items a second life.">

  <link rel="icon" href="assets/favicon.png" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #140E08;
      --brick: #D9612C;
      --brass: #E8B84B;
      --cream: #F2ECE0;
      --cream-dim: rgba(242,236,224,0.72);
      --line: rgba(242,236,224,0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--cream);
      background: var(--ink);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Mobile: portrait room photo */
    .bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(180deg, rgba(20,14,8,0.62) 0%, rgba(20,14,8,0.18) 18%, rgba(20,14,8,0.12) 45%, rgba(20,14,8,0.55) 78%, rgba(15,10,6,0.92) 100%),
        url('assets/room.jpg');
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
    }

    /* Desktop / laptop: wider hero photo */
    @media (min-width: 768px) {
      .bg {
        background-image:
          linear-gradient(180deg, rgba(20,14,8,0.62) 0%, rgba(20,14,8,0.18) 18%, rgba(20,14,8,0.12) 45%, rgba(20,14,8,0.55) 78%, rgba(15,10,6,0.92) 100%),
          url('assets/background-image.jpg');
        background-position: center 35%;
      }
    }

    .content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 24px 24px;
    }

    /* ===== TOP: logo ===== */
    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 8px;
    }
    .logo img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      margin-bottom: -3px;
}

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--brass);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .eyebrow::before, .eyebrow::after {
      content: "—";
      color: var(--cream-dim);
      margin: 0 8px;
    }

    .logo {
      display: flex;
      align-items: flex-end;
      gap: 10px;

      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(20px, 2vw, 24px);
      letter-spacing: -0.01em;
      line-height: 1;
      text-transform: uppercase;
      color: #fff;
    }
    

    /* ===== MIDDLE: slogan ===== */
    .middle {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 8px;
    }

    .slogan {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(28px, 9vw, 64px);
      text-transform: uppercase;
      line-height: 1.02;
      letter-spacing: -0.01em;
      max-width: 780px;
    }
    .slogan .line2 { color: var(--brass); }

    .subtitle {
      font-family: 'Work Sans', sans-serif;
      font-weight: 500;
      font-size: clamp(13px, 2.4vw, 16px);
      letter-spacing: 0.02em;
      color: var(--cream-dim);
      margin-top: 18px;
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ===== CTA / badges ===== */
    .cta-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      
    }

    .btn { display: inline-block; border-radius: 10px; }

    .store-badge {
      height: auto;
      width: min(42vw, 170px);
      display: block;
      border-radius: 10px;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.35));
      transition: transform .15s ease, filter .15s ease;
    }
    .btn:hover .store-badge { transform: translateY(-2px); }
    .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 10px; }

    /* ===== FOOTER ===== */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .foot-links { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    .foot-links a {
      color: var(--cream-dim);
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .foot-links a:hover { color: var(--cream); text-decoration: underline; }

    .copyright { font-size: 11px; color: rgba(242,236,224,0.45); }

    @media (max-width: 420px) {
      .store-badge { height: 50px; }
      .content { padding: 24px 16px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="bg"></div>

    <div class="content">

      <!-- TOP: logo -->
      <div class="top">
        <div class="eyebrow">Est. on the stoop</div>
        <div class="logo">
          <img src="assets/Logo-white.png" alt="StreetJams logo">
          <span>StreetJams</span>
        </div>
      </div>

      <!-- MIDDLE: slogan -->
      <div class="middle">
        <div>
          <div class="slogan">my room<br><span class="line2">is the city</span></div>
          <p class="subtitle">Spot. Snap. Stoop. Give great items a second life while reducing urban waste.</p>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-group">
        <a href="https://apps.apple.com/gb/app/streetjams/id6777686015" class="btn" alt="app store url">
          <img
            src="/assets/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
            alt="Download on the App Store"
            class="store-badge"
          >
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.streetjams.app" class="btn" alt="play store url">
          <img
            src="/assets/GetItOnGooglePlay_Badge_Web_color_English.svg"
            alt="Download on the Google Play Store"
            class="store-badge"
          >
        </a>
      </div>

      <!-- FOOTER -->
      <footer>
        <div class="foot-links">
          <a href="/privacy">Privacy Policy</a>
          <a href="/terms">Terms &amp; Conditions</a>
          <a href="/support">Support</a>
        </div>
        <div class="copyright">© 2026 StreetJams. All rights reserved.</div>
      </footer>

    </div>
  </div>

</body>
</html>
